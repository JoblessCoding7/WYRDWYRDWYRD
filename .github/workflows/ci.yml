name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: write # only to commit the resolved pnpm-lock.yaml back to feature branches

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.17.0

      - name: Install dependencies
        # Not frozen while the dependency set is changing; the resolved lockfile is committed below.
        run: pnpm install --no-frozen-lockfile

      - name: Commit resolved lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update pnpm-lock.yaml" -- pnpm-lock.yaml
            git push
          fi

      - name: Typecheck
        run: |
          pnpm typecheck > typecheck.log 2>&1 && exit 0
          cat typecheck.log
          echo "::error title=Typecheck::$(tail -60 typecheck.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
          exit 1
      - name: Lint
        run: |
          pnpm lint > lint.log 2>&1 && exit 0
          cat lint.log
          echo "::error title=Lint::$(tail -60 lint.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
          exit 1
      - name: Test
        run: |
          pnpm test > test.log 2>&1 && exit 0
          cat test.log
          echo "::error title=Test::$(tail -60 test.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
          exit 1
      - name: Build
        run: |
          pnpm build > build.log 2>&1 && exit 0
          cat build.log
          echo "::error title=Build::$(tail -60 build.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
          exit 1

      - name: Smoke test (same start command as docs/deploy.md, mock provider)
        run: |
          set -e
          trap 'echo "::error title=Smoke test::failed at line $LINENO: $BASH_COMMAND"' ERR
          cp .env.example .env
          node --env-file=.env node_modules/@react-router/serve/bin.js ./build/server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q '<html'
          curl -sf http://localhost:3000/products/album-product | grep -q 'KILL THOME 2'
          curl -sf http://localhost:3000/api/products/kt2 | tee /dev/stderr | grep -q '"source":"mock"'
          curl -sf -X POST http://localhost:3000/api/checkout \
            -H 'content-type: application/json' \
            -d '{"lineItems":[{"productId":"kt2-limited-edition-merch","quantity":2}]}' \
            | tee /dev/stderr | grep -q '/checkout/mock?quantity=2'
          curl -sf 'http://localhost:3000/checkout/mock?quantity=2' | grep -q '结账演示'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/products/nope)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/youzan/webhook -d '{}')" = 503

      - name: Server log
        if: failure()
        run: |
          cat server.log || true
          echo "::error title=Server log::$(tail -60 server.log 2>/dev/null | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
